# --- General ---
set -g default-terminal "tmux-256color"
# Plain -g (not -ag): appending re-stacked these on every reload
set -g terminal-overrides "linux*:AX@,xterm-256color:RGB,*256col*:Tc"
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g escape-time 0
set -g history-limit 10000

# Forward focus changes to nvim (autoread / FocusGained autocmds)
set -g focus-events on

# Default 750ms is too short to read config-reload errors
set -g display-time 4000

# vi-style copy mode: Space begins selection, Enter copies (emacs mode
# binds Space to page-down and leaves Enter unbound)
setw -g mode-keys vi

# --- Catppuccin theme ---
set -g @catppuccin_flavor "mocha"
set -g @catppuccin_window_status_style "rounded"

set -g status-left ""
set -g status-right-length 100
set -g status-left-length 100
set -g status-right "#{E:@catppuccin_status_session}"
set -ag status-right "#{E:@catppuccin_status_uptime}"
set -ag status-right "#{E:@catppuccin_status_date_time}"

# --- Plugins (TPM) ---
# Pin the plugin dir explicitly: TPM's XDG auto-detection keys off
# ~/.config/tmux/tmux.conf existing, which is false when this file is
# loaded as ~/.tmux.conf. Without this, plugins land in ~/.tmux/plugins.
set-environment -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.config/tmux/plugins/"

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'catppuccin/tmux#v2.3.0'

# Bootstrap TPM in the background: -b so a slow or stalled clone can never
# block tmux from starting. GIT_CONFIG_* disables credential.helper for both
# clones - the HTTPS fetch otherwise reaches for the macOS keychain, which
# throws a modal dialog when it cannot find one. Re-sources tpm when done so
# the very first run still ends up themed.
if "test ! -d $HOME/.config/tmux/plugins/tpm" \
   "run -b 'export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=credential.helper GIT_CONFIG_VALUE_0=; git clone -q https://github.com/tmux-plugins/tpm $HOME/.config/tmux/plugins/tpm && $HOME/.config/tmux/plugins/tpm/bin/install_plugins && $HOME/.config/tmux/plugins/tpm/tpm'"

# Load plugins when TPM is present. Guarded so a first run on a fresh machine
# does not error; the background bootstrap above sources them itself.
if "test -d $HOME/.config/tmux/plugins/tpm" \
   "run '$HOME/.config/tmux/plugins/tpm/tpm'"
